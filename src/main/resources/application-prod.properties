# ============================================================================
# ExecutionEngine Service - Production Profile
# ============================================================================
# This profile is activated with: spring.profiles.active=prod
# Environment variables should override these defaults.

spring.profiles.active=prod

# ============================================================================
# Database Configuration (Production - PostgreSQL)
# ============================================================================
# Expected environment variables:
# - DB_URL: JDBC connection URL
# - DB_USERNAME: Database username
# - DB_PASSWORD: Database password

spring.datasource.url=${DB_URL:jdbc:postgresql://db-host:5432/executionengine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration (Production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# Logging Configuration (Production)
# ============================================================================
logging.level.root=WARN
logging.level.com.epam.executionengine=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.hibernate=WARN

logging.file.name=/var/log/executionengine/application.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=10GB

# ============================================================================
# Spring Boot Actuator Configuration (Production)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================================================================
# Server Configuration (Production)
# ============================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================================================
# URL Shortening Service Configuration (Production)
# ============================================================================
# These can be overridden via environment variables
urlshortener.base-url=${URLSHORTENER_BASE_URL:https://exe.local/s}
urlshortener.short-code-length=${URLSHORTENER_CODE_LENGTH:6}
urlshortener.collision-retry-limit=5
urlshortener.enable-analytics=true
urlshortener.max-url-length=8000

# ============================================================================
# Security Configuration
# ============================================================================
# Disable info endpoint details in production
management.endpoint.info.enabled=false

# ============================================================================
# Error Handling (Production - Minimal Details)
# ============================================================================
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always
server.error.include-binding-errors=always
