# ============================================================================
# ExecutionEngine Service - Application Configuration
# ============================================================================

# Application Name and Version
spring.application.name=execution-engine-service
app.version=1.0.0

# ============================================================================
# Server Configuration
# ============================================================================
server.port=8080
server.servlet.context-path=/
server.tomcat.max-http-post-size=10MB
server.tomcat.max-http-header-size=8KB
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================================================
# Database Configuration (PostgreSQL)
# ============================================================================
# Note: These defaults are for development. Use environment variables or
# external config server for production deployment.

spring.datasource.url=jdbc:postgresql://localhost:5432/executionengine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.epam.executionengine=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# Spring Boot Actuator Configuration
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================================================================
# URL Shortening Service Configuration
# ============================================================================

# Base URL for generated short URLs
urlshortener.base-url=https://exe.local/s

# Length of generated short codes (in characters)
urlshortener.short-code-length=6

# Maximum number of collision retry attempts
urlshortener.collision-retry-limit=5

# Default expiration period for new URLs (0 = never expires)
urlshortener.default-expiration-days=0

# Enable analytics tracking
urlshortener.enable-analytics=true

# Maximum allowed URL length (characters)
urlshortener.max-url-length=8000

# Rate limiting configuration
urlshortener.rate-limit.requests-per-minute=100

# ============================================================================
# SpringDoc OpenAPI (Swagger) Configuration
# ============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ============================================================================
# Jackson Configuration (JSON Serialization)
# ============================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.time-zone=UTC

# ============================================================================
# HTTP Encoding
# ============================================================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
