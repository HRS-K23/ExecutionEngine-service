# ============================================================================
# ExecutionEngine Service - Development Profile
# ============================================================================
# This profile is activated with: spring.profiles.active=dev

spring.profiles.active=dev

# ============================================================================
# Database Configuration (Development - H2 In-Memory)
# ============================================================================
# Use H2 in-memory database for rapid development and testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================================================
# Logging Configuration (Development)
# ============================================================================
logging.level.root=INFO
logging.level.com.epam.executionengine=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================================================
# Spring Boot Actuator Configuration (Development)
# ============================================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================================================
# URL Shortening Service Configuration (Development)
# ============================================================================
urlshortener.base-url=http://localhost:8080/s
urlshortener.short-code-length=6
urlshortener.collision-retry-limit=5
urlshortener.enable-analytics=true

# ============================================================================
# Spring Boot DevTools
# ============================================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================================================
# Error Handling (Development - Verbose)
# ============================================================================
server.error.include-stacktrace=always
server.error.include-exception=true
